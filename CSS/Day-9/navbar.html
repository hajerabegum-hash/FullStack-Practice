<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smooth Navbar Transitions</title>
  <link rel="stylesheet" href="navbar.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-logo">WebDev</div>
    <ul class="nav-menu">
      <!-- Style 1: Smooth Background / Text Color Change -->
      <li><a href="#" class="nav-link style-color">Home</a></li>
      
      <!-- Style 2: Animated Underline Effect -->
      <li><a href="#" class="nav-link style-underline">About</a></li>
      
      <!-- Style 3: Subtle Scale / Lift Effect -->
      <li><a href="#" class="nav-link style-lift">Services</a></li>
      
      <li><a href="#" class="nav-link style-underline">Contact</a></li>
    </ul>
  </nav>

</body>
</html>
