<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starry Night</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(to bottom, #020111 0%, #3a3a52 100%);
        overflow: hidden;
      }

      /* Stars */
      .star {
        position: absolute;
        background: white;
        border-radius: 50%;
        animation: twinkle 3s infinite ease-in-out;
      }

      /* Twinkle animation */
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.2;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.2);
          box-shadow: 0 0 10px white;
        }
      }

      /* Different sizes */
      .star.small {
        width: 2px;
        height: 2px;
      }
      .star.medium {
        width: 3px;
        height: 3px;
      }
      .star.large {
        width: 4px;
        height: 4px;
      }

      /* Moon */
      .moon {
        position: absolute;
        top: 10%;
        right: 15%;
        width: 100px;
        height: 100px;
        background: #f0f0f0;
        border-radius: 50%;
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="moon"></div>

    <!-- Stars - just copy more to add more stars -->
    <div
      class="star small"
      style="top: 10%; left: 20%; animation-delay: 0s"
    ></div>
    <div
      class="star medium"
      style="top: 30%; left: 50%; animation-delay: 1s"
    ></div>
    <div
      class="star large"
      style="top: 60%; left: 10%; animation-delay: 2s"
    ></div>
    <div
      class="star small"
      style="top: 80%; left: 70%; animation-delay: 0.5s"
    ></div>
    <div
      class="star medium"
      style="top: 40%; left: 80%; animation-delay: 1.5s"
    ></div>
    <div
      class="star small"
      style="top: 20%; left: 90%; animation-delay: 2.5s"
    ></div>
    <div
      class="star large"
      style="top: 70%; left: 40%; animation-delay: 1s"
    ></div>
    <div
      class="star small"
      style="top: 50%; left: 25%; animation-delay: 3s"
    ></div>
    <div
      class="star medium"
      style="top: 15%; left: 60%; animation-delay: 0.8s"
    ></div>
    <div
      class="star small"
      style="top: 85%; left: 30%; animation-delay: 2.2s"
    ></div>
  </body>
</html>
